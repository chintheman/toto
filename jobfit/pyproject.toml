[project]
name = "jobfit"
version = "0.1.0"
description = "Evidence-grounded job discovery and honest resume/cover-letter tailoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
    "reportlab>=4.2",
    "pypdf>=4.2",
    "selectolax>=0.3.21",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Self-host only. Scrapes job boards directly from your own IP; see README "Sourcing and the law".
jobspy = ["python-jobspy>=1.1.80"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "stripe>=10.0", "asyncpg>=0.29"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
jobfit = "jobfit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "jobspy.*", "reportlab.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
