# Example fact base. Copy to `profile/facts.yaml` and replace with your own.
#
# Rules that the pipeline enforces rather than merely requests:
#   * `employer`, `title`, `period`, `institution`, `credential` are IMMUTABLE. They may
#     appear in generated output only exactly as written here.
#   * Every number you write here becomes a number the writer is licensed to use. Every
#     number you do NOT write here is rejected by the gate as fabrication.
#   * `evidence` is how you would prove the claim if challenged in an interview. Facts
#     without it still work, but `jobfit facts audit` flags them — if you cannot say how
#     you would prove it, reconsider putting it on a resume.
#
# Write claims you can defend under questioning. The tool's whole value is that it will
# not quietly improve them for you.

facts:
  - id: f.acme.renewals
    kind: experience
    employer: Acme Systems
    title: APAC Enterprise Lead
    period: 2021-01/2023-06
    claim: >-
      Held 100% logo renewal across the APAC enterprise book through two rounds of
      budget freezes, including the year the region lost its largest sponsor.
    evidence: >-
      Salesforce renewal report, Q2 2023: 14 enterprise accounts carried, 0 churned
      across the tenure.
    tags: [enterprise-sales, apac, retention, renewals]

  - id: f.acme.pricing-rebuild
    kind: experience
    employer: Acme Systems
    title: APAC Enterprise Lead
    period: 2021-01/2023-06
    claim: >-
      Rebuilt regional pricing after discovering the existing model lost money on every
      deal below 40 seats, which had been true for three quarters before anyone checked.
    evidence: >-
      Pricing memo, Mar 2022, and the revised rate card still in use at time of leaving.
    tags: [pricing, commercial, analysis]

  - id: f.acme.failed-partner-program
    kind: experience
    employer: Acme Systems
    title: APAC Enterprise Lead
    period: 2021-01/2023-06
    claim: >-
      Launched a reseller partner program that failed: signed 6 partners, none reached
      quota, and it was wound down after 9 months. The mistake was recruiting partners
      for reach rather than for existing access to the buyer.
    evidence: Partner program post-mortem, Nov 2022.
    tags: [partnerships, failure, go-to-market]

  - id: f.northwind.support-queue
    kind: experience
    employer: Northwind
    title: Customer Operations Manager
    period: 2018-03/2020-12
    claim: >-
      Took the support queue from a 3 day median first response to same day by killing
      the tiering system rather than adding headcount.
    evidence: Zendesk median-first-response dashboards, Mar 2018 vs Dec 2020.
    tags: [operations, support, process]

  - id: f.side.ragbot
    kind: project
    title: Personal project
    period: 2024-02/2024-08
    claim: >-
      Built and ran a retrieval-augmented assistant over 4 years of personal notes,
      including the evaluation harness that showed the first two retrieval approaches
      were worse than keyword search.
    evidence: Public repository with the eval harness and result tables.
    tags: [llm, rag, python, evaluation]

  - id: f.edu.nus
    kind: education
    institution: National University of Singapore
    credential: BSc Economics
    period: 2014-08/2018-05
    claim: BSc Economics, National University of Singapore.
    evidence: Degree certificate.
    tags: [education, economics]

  - id: f.lang
    kind: skill
    claim: Works in English and Mandarin, including commercial negotiation in both.
    evidence: Ran the Greater China account set at Acme Systems in Mandarin.
    tags: [languages, mandarin, english]
