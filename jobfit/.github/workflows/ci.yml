# This is the workflow for the *standalone* jobfit repository, where this file sits at
# the repo root and GitHub runs it. While jobfit still lives as a subdirectory of another
# repo, GitHub ignores this copy — only `.github/workflows/` at that repo's root is read,
# which is what `jobfit-ci.yml` there is for. Keeping the standalone version here means
# `git subtree split -P jobfit` produces a repo that is green on its first push, with no
# post-extraction edits to remember.
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"

      - name: lint
        run: uv run ruff check src tests

      - name: types
        run: uv run mypy src

      # No network access and no API keys: every source is exercised against recorded
      # payloads. A green run says the normalisation and billing logic is correct, not
      # that any vendor is up.
      - name: tests
        run: uv run pytest -q
