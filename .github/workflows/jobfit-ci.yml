# Lives at the repository root because GitHub only reads workflows from
# `.github/workflows/` there — a copy under `jobfit/` is never executed. On extracting
# `jobfit/` into its own repository (`git subtree split -P jobfit`), move this file to
# that repo's root and drop the `working-directory` default and the path filters.
name: jobfit ci

on:
  push:
    paths: ["jobfit/**", ".github/workflows/jobfit-ci.yml"]
  pull_request:
    paths: ["jobfit/**", ".github/workflows/jobfit-ci.yml"]

defaults:
  run:
    working-directory: jobfit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"

      - name: lint
        run: uv run ruff check src tests

      - name: types
        run: uv run mypy src

      # No network access and no API keys: every source is exercised against recorded
      # payloads. A green CI run says the normalisation and billing logic is correct, not
      # that any vendor is up.
      - name: tests
        run: uv run pytest -q
