name: TotoApp
options:
  bundleIdPrefix: com.chintheman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer Team ID once enrolled

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  TotoApp:
    type: application
    platform: iOS
    sources:
      - path: TotoApp
        excludes:
          - "**/*.md"
    resources:
      - path: TotoApp/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: TotoApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: TOTO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chintheman.toto
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        DEVELOPMENT_TEAM: JU475PP468
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Distribution: Chin Tuan Chuang (JU475PP468)"
        PROVISIONING_PROFILE_SPECIFIER: TotoBuddy AppStore Distribution

  TotoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TotoAppTests
    dependencies:
      - target: TotoApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chintheman.toto.tests

  TotoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TotoAppUITests
    dependencies:
      - target: TotoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chintheman.toto.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TotoApp

schemes:
  TotoApp:
    build:
      targets:
        TotoApp: all
        TotoAppTests: [test]
        TotoAppUITests: [test]
    test:
      targets:
        - TotoAppTests
        - TotoAppUITests
    run:
      config: Debug
